[package]
name = "localflow"
version = "0.1.0"
description = "System-wide local-first AI dictation"
edition = "2021"

[lib]
name = "localflow"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-macos-permissions = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# pipeline
cpal = "0.18"
rubato = "0.16"
voice_activity_detector = "0.2"
whisper-rs = { version = "0.16", features = ["metal"] }
enigo = "0.6"
arboard = "3"
crossbeam-channel = "0.5"

# model download
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"

# dev/test utility (wav loading for transcribe_wav command)
hound = "3"
transcribe-rs = { version = "=0.3.0", default-features = false, features = ["onnx"] }
keyring = "4"
async-trait = "0.1"
regex = "1"
tauri-plugin-autostart = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-single-instance = "2.4.2"

# hotkey event tap (see hotkey.rs — rdev crashes on macOS 15)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2-app-kit = "0.3"

[profile.release]
lto = true
codegen-units = 1
